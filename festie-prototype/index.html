<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0A0A0A">
<title>Festie 프로토타입</title>
<meta name="description" content="페스티벌 준비부터 기억까지 한곳에 담는 아카이브 앱 Festie의 인터랙티브 프로토타입">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@600;700&amp;family=Hanken+Grotesk:wght@400;500;600&amp;family=Noto+Sans+KR:wght@400;500;700&amp;display=swap">
<style>
  :root { --ink: #0A0A0A; --lav: #F3D9FF; --glow: #FFFACD; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--ink);
    color: var(--lav);
    font-family: 'Hanken Grotesk', 'Noto Sans KR', sans-serif;
    display: flex; align-items: center; justify-content: center; gap: 48px;
    min-height: 100vh; padding: 24px; overflow: hidden;
  }
  .stage { flex-shrink: 0; }
  .phone {
    width: 390px; height: 844px; border-radius: 40px; overflow: hidden;
    transform-origin: top left; background: var(--lav);
    box-shadow: 0 0 0 10px #1c1c1c, 0 24px 60px rgba(0,0,0,0.6);
  }
  .panel { width: 260px; display: flex; flex-direction: column; gap: 18px; }
  .panel h1 { margin: 0; font-family: 'Josefin Sans', sans-serif; font-weight: 700; font-size: 44px; letter-spacing: -0.02em; line-height: 0.9; }
  .panel p { margin: 0; font-family: 'Noto Sans KR', sans-serif; font-size: 14px; line-height: 1.6; color: rgba(243,217,255,0.78); }
  .panel label { font-family: 'Noto Sans KR', sans-serif; font-weight: 700; font-size: 13px; }
  .panel select, .panel button {
    width: 100%; min-height: 44px; border: 1.5px solid var(--lav); background: transparent; color: var(--lav);
    font-family: 'Noto Sans KR', sans-serif; font-size: 14px; padding: 0 12px; cursor: pointer;
  }
  .panel select option { color: var(--ink); }
  .panel button { background: var(--lav); color: var(--ink); font-weight: 700; }
  .field { display: flex; flex-direction: column; gap: 8px; }
  @media (max-width: 760px) {
    body { padding: 0; gap: 0; align-items: flex-start; }
    .panel { display: none; }
    .phone { border-radius: 0; box-shadow: none; }
  }
</style>
</head>
<body>
<div class="stage" id="stage"><div class="phone" id="phone"><div id="app"></div></div></div>

<aside class="panel" aria-label="프로토타입 안내">
  <h1>FESTIE</h1>
  <p>페스티벌 준비부터 기억까지 한곳에 담는 아카이브 앱의 프로토타입이에요. 탐색에서 그랜드 민트 페스티벌을 찾아 준비를 시작해 보세요.</p>
  <div class="field">
    <label for="start">화면 바로가기</label>
    <select id="start">
      <option value="discover">01 탐색 홈</option>
      <option value="genre">02 장르 칩 선택 · 인디</option>
      <option value="search">03 검색 화면</option>
      <option value="searchResult">04 검색 결과</option>
      <option value="detail">05 페스티벌 상세</option>
      <option value="artist">06 라인업 아티스트 무대</option>
      <option value="prepEmpty">07 준비 홈 · 비어 있음</option>
      <option value="dashStart">08 준비하기 · 시작</option>
      <option value="tte">09 타임테이블 · 1일차 고르기</option>
      <option value="tteBlocked">10 시간 겹침 · 선택 불가</option>
      <option value="tteSheet1">11 1일차 담기 완료</option>
      <option value="tteOnlyDay1">12 1일차만 설정 안내</option>
      <option value="tte2">13 2일차 고르기</option>
      <option value="tteSheetAll">14 1·2일차 모두 담기 완료</option>
      <option value="tt">15 내 타임테이블</option>
      <option value="dashMid">16 준비하기 · 상태 칩</option>
      <option value="check">17 체크리스트</option>
      <option value="playlist">18 플레이리스트 · 곡 빼기</option>
      <option value="playlistSheet">19 음악 앱으로 내보내기</option>
      <option value="ticket">20 티켓 등록</option>
      <option value="dashDone">21 준비하기 · 모두 완료</option>
      <option value="summary">22 내 준비 한눈에</option>
      <option value="recordLocked">23 기록 · 잠김</option>
      <option value="recordReady">24 기록 · 리포트 만들기</option>
      <option value="reportEdit">25 리포트 만들기 · 빈 상태</option>
      <option value="reportFilled">26 리포트 만들기 · 입력 완료</option>
      <option value="report">27 완성된 리포트</option>
      <option value="reportEditing">27-1 리포트 수정하기</option>
      <option value="recordSaved">28 기록 홈 · 저장 후</option>
      <option value="my">29 MY</option>
    </select>
  </div>
  <button type="button" id="restart">처음부터 다시 하기</button>
</aside>

<script>
(function () {
  var params = new URLSearchParams(location.search);
  var start = params.get('start') || 'discover';
  var select = document.getElementById('start');
  if (select.querySelector('option[value="' + start + '"]')) select.value = start;

  dcLite.mount({
    template: document.getElementById('festie-screens'),
    component: window.FestieApp,
    target: document.getElementById('app'),
    props: { start: start }
  });

  function go(s) {
    var url = new URL(location.href);
    if (s === 'discover') url.searchParams.delete('start'); else url.searchParams.set('start', s);
    location.href = url.toString();
  }
  select.addEventListener('change', function () { go(select.value); });
  document.getElementById('restart').addEventListener('click', function () { go('discover'); });

  // 화면 크기에 맞춰 390×844 폰 화면을 줄여서 보여줘요
  var stage = document.getElementById('stage');
  var phone = document.getElementById('phone');
  function fit() {
    var narrow = window.innerWidth <= 760;
    var s = narrow
      ? window.innerWidth / 390
      : Math.min(1, (window.innerHeight - 48) / 844, (window.innerWidth - 360) / 390);
    s = Math.max(0.4, s);
    phone.style.transform = 'scale(' + s + ')';
    stage.style.width = (390 * s) + 'px';
    stage.style.height = (844 * s) + 'px';
    document.body.style.overflow = narrow ? 'auto' : 'hidden';
  }
  window.addEventListener('resize', fit);
  fit();
})();
</script>
